name: Playwright E2E Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  repository_dispatch:
    types: [ trigger-e2e-tests ]

jobs:
  test:
    name: E2E Tests on ${{ matrix.browser }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --only-binary :all: -r requirements.txt

      - name: Install Playwright Browsers
        run: playwright install --with-deps

      - name: Run Playwright tests
        env:
          BASE_URL: ${{ vars.BASE_URL || 'https://app.mpodx.com' }}
          API_URL: ${{ vars.API_URL || 'https://controller.mpodx.com' }}
          TEST_USER_EMAIL: ${{ vars.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ vars.TEST_USER_PASSWORD }}
          TEST_USER_USERNAME: ${{ vars.TEST_USER_USERNAME }}
          BROWSER: ${{ matrix.browser }}
          HEADLESS: "true"
        run: pytest -n auto --alluredir=allure-results

      - name: Upload Playwright traces and videos on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-artifacts-${{ matrix.browser }}
          path: artifacts/
          retention-days: 2

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results/
          retention-days: 7

  generate-report:
    name: Generate Allure Report
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all allure results
        uses: actions/download-artifact@v4
        with:
          path: allure-results
          pattern: allure-results-*
          merge-multiple: true

      - name: Get Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-dir

      - name: Copy Allure history
        run: |
          mkdir -p allure-results/history
          cp -R gh-pages-dir/history/* allure-results/history/ || true

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: allure-results
          allure_history: allure-history
          keep_reports: 10

      - name: Deploy report to Github Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          force_orphan: true
